<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Умный дом — Центр управления</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body { background: #f0f2f5; font-family: 'Segoe UI', sans-serif; }
        .device-card {
            border-radius: 16px; border: none; background: white;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08); transition: transform 0.2s;
        }
        .device-card:hover { transform: translateY(-2px); }
        .state-badge {
            font-size: 0.9rem; padding: 0.35em 1em; border-radius: 20px; font-weight: 600;
        }
        .on { background: #d4edda; color: #155724; }
        .off { background: #f8d7da; color: #721c24; }
        .value-box { background: #f8f9fa; border-radius: 10px; padding: 6px 10px; margin: 3px; display: inline-block; }
        .section-title { font-weight: 700; margin-top: 30px; margin-bottom: 15px; color: #2c3e50; }
        .btn-control { min-width: 80px; font-weight: 600; }
    </style>
</head>
<body>
<div class="container py-4">
    <h1 class="mb-4 text-center">🏠 Умный дом</h1>

    <!-- Вкладки для навигации -->
    <ul class="nav nav-tabs mb-4" id="mainTabs" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active" id="devices-tab" data-bs-toggle="tab" data-bs-target="#devices-pane" type="button" role="tab">Устройства</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="groups-tab" data-bs-toggle="tab" data-bs-target="#groups-pane" type="button" role="tab">Группы</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="scenarios-tab" data-bs-toggle="tab" data-bs-target="#scenarios-pane" type="button" role="tab">Сценарии</button>
        </li>
    </ul>

    <div class="tab-content">
        <!-- Вкладка "Устройства" -->
        <div class="tab-pane fade show active" id="devices-pane" role="tabpanel">
            <div class="row" id="deviceContainer">
                <div class="col-12 text-center py-5 text-muted">Загрузка устройств...</div>
            </div>
        </div>

        <!-- Вкладка "Группы" -->
        <div class="tab-pane fade" id="groups-pane" role="tabpanel">
            <div class="row">
                <div class="col-md-5">
                    <div class="card mb-3">
                        <div class="card-header fw-bold">Создать группу</div>
                        <div class="card-body">
                            <div class="mb-3">
                                <label class="form-label">Название группы</label>
                                <input type="text" class="form-control" id="groupNameInput" placeholder="Например, Весь свет">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Выберите устройства</label>
                                <div id="deviceCheckboxes"></div>
                            </div>
                            <button class="btn btn-success w-100" onclick="createGroup()"><i class="bi bi-plus-circle"></i> Создать</button>
                        </div>
                    </div>
                </div>
                <div class="col-md-7">
                    <div id="groupList"></div>
                </div>
            </div>
        </div>

        <!-- Вкладка "Сценарии" -->
        <div class="tab-pane fade" id="scenarios-pane" role="tabpanel">
            <div class="row">
                <div class="col-md-5">
                    <div class="card mb-3">
                        <div class="card-header fw-bold">Новый сценарий</div>
                        <div class="card-body">
                            <div class="mb-3">
                                <label class="form-label">Название</label>
                                <input type="text" class="form-control" id="scenarioName" placeholder="Название сценария">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Когда выполнять?</label>
                                <select class="form-select" id="triggerType" onchange="toggleTriggerFields()">
                                    <option value="cron">По расписанию (ежедневно)</option>
                                    <option value="interval">Периодически (каждые N секунд)</option>
                                </select>
                            </div>
                            <div id="cronFields" class="mb-3">
                                <div class="row g-2">
                                    <div class="col"><input type="number" class="form-control" id="cronHour" placeholder="Часы" min="0" max="23"></div>
                                    <div class="col"><input type="number" class="form-control" id="cronMinute" placeholder="Минуты" min="0" max="59"></div>
                                </div>
                            </div>
                            <div id="intervalField" class="mb-3" style="display:none">
                                <input type="number" class="form-control" id="intervalSeconds" placeholder="Интервал в секундах" min="1">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Какие устройства?</label>
                                <div id="scenarioDeviceCheckboxes"></div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Действие</label>
                                <select class="form-select" id="actionState">
                                    <option value='{"state":"ON"}'>Включить</option>
                                    <option value='{"state":"OFF"}'>Выключить</option>
                                    <option value='{"state":"TOGGLE"}'>Переключить</option>
                                </select>
                            </div>
                            <button class="btn btn-primary w-100" onclick="addScenario()"><i class="bi bi-clock"></i> Добавить сценарий</button>
                        </div>
                    </div>
                </div>
                <div class="col-md-7">
                    <div id="scenarioList"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
// Глобальное хранилище устройств и их состояний
let allDevices = {};
let allDeviceStates = {};

// Загрузка устройств и состояний
async function refreshAll() {
    const resp = await fetch('/api/devices');
    allDeviceStates = await resp.json();
    // Обновляем список имён устройств (если появились новые)
    for (const name of Object.keys(allDeviceStates)) {
        if (!allDevices[name]) allDevices[name] = true;
    }
    renderDeviceCards();
    renderGroupDeviceCheckboxes();
    renderScenarioDeviceCheckboxes();
}

// Рендеринг карточек устройств
function renderDeviceCards() {
    const container = document.getElementById('deviceContainer');
    let html = '';
    for (const [name, state] of Object.entries(allDeviceStates)) {
        const isOn = state.state === 'ON';
        const stateClass = isOn ? 'on' : 'off';
        const stateText = isOn ? 'Включено' : 'Выключено';
        const power = state.power ? state.power.toFixed(1) : '—';
        const energy = state.energy ? state.energy.toFixed(2) : '—';
        const temp = state.device_temperature ? state.device_temperature.toFixed(0) : '—';
        const voltage = state.voltage ? state.voltage : '—';
        const link = state.linkquality ? state.linkquality : '—';

        html += `
        <div class="col-xl-3 col-lg-4 col-md-6 mb-4">
            <div class="card device-card p-3 h-100">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <h5 class="mb-0"><i class="bi bi-outlet"></i> ${escapeHtml(name)}</h5>
                    <span class="state-badge ${stateClass}">${stateText}</span>
                </div>
                <div class="mb-2">
                    <small class="text-muted">Потребление сейчас</small>
                    <div class="fs-4 fw-bold">${power} <small>Вт</small></div>
                </div>
                <div class="d-flex flex-wrap">
                    <span class="value-box" title="Всего энергии"><i class="bi bi-lightning-charge"></i> ${energy} кВт·ч</span>
                    <span class="value-box" title="Температура"><i class="bi bi-thermometer-half"></i> ${temp}°C</span>
                    <span class="value-box" title="Напряжение"><i class="bi bi-plug"></i> ${voltage} В</span>
                    <span class="value-box" title="Качество связи"><i class="bi bi-reception-4"></i> ${link}</span>
                </div>
                <div class="mt-3 d-flex gap-2">
                    <button class="btn btn-success btn-control flex-grow-1" onclick="sendCommand('${name}', 'ON')" ${isOn ? 'disabled' : ''}><i class="bi bi-toggle-on"></i> Вкл</button>
                    <button class="btn btn-danger btn-control flex-grow-1" onclick="sendCommand('${name}', 'OFF')" ${!isOn ? 'disabled' : ''}><i class="bi bi-toggle-off"></i> Выкл</button>
                </div>
            </div>
        </div>`;
    }
    container.innerHTML = html || '<div class="col-12 text-center py-5 text-muted">Нет устройств</div>';
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.appendChild(document.createTextNode(text));
    return div.innerHTML;
}

async function sendCommand(friendly, action) {
    await fetch('/api/command', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({friendly_name: friendly, command: {state: action}})
    });
    // Немедленный визуальный отклик (оптимистичное обновление)
    if (allDeviceStates[friendly]) {
        allDeviceStates[friendly].state = action;
        renderDeviceCards();
    }
    setTimeout(refreshAll, 500);
}

// ============ Группы ============
function renderGroupDeviceCheckboxes() {
    const container = document.getElementById('deviceCheckboxes');
    let html = '';
    for (const name of Object.keys(allDeviceStates)) {
        html += `<div class="form-check"><input class="form-check-input group-device-check" type="checkbox" value="${escapeHtml(name)}" id="gdev-${name}"><label class="form-check-label" for="gdev-${name}">${escapeHtml(name)}</label></div>`;
    }
    container.innerHTML = html || '<small class="text-muted">Нет устройств</small>';
}

async function createGroup() {
    const name = document.getElementById('groupNameInput').value.trim();
    if (!name) return alert('Введите название группы');
    const checks = document.querySelectorAll('.group-device-check:checked');
    const devices = Array.from(checks).map(cb => cb.value);
    await fetch('/api/groups', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({name, devices})
    });
    document.getElementById('groupNameInput').value = '';
    loadGroups();
}

async function loadGroups() {
    const resp = await fetch('/api/groups');
    const groups = await resp.json();
    const container = document.getElementById('groupList');
    let html = '';
    for (const [name, devices] of Object.entries(groups)) {
        html += `
        <div class="card mb-2">
            <div class="card-body d-flex justify-content-between align-items-center">
                <div>
                    <h6 class="mb-1">${escapeHtml(name)}</h6>
                    <small class="text-muted">${devices.join(', ')}</small>
                </div>
                <div class="btn-group">
                    <button class="btn btn-sm btn-success" onclick="groupCommand('${name}', 'ON')"><i class="bi bi-toggle-on"></i> Вкл</button>
                    <button class="btn btn-sm btn-danger" onclick="groupCommand('${name}', 'OFF')"><i class="bi bi-toggle-off"></i> Выкл</button>
                    <button class="btn btn-sm btn-outline-secondary" onclick="deleteGroup('${name}')"><i class="bi bi-trash"></i></button>
                </div>
            </div>
        </div>`;
    }
    container.innerHTML = html || '<p class="text-muted">Нет групп</p>';
}

async function groupCommand(groupName, action) {
    await fetch('/api/groups/command', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({group_name: groupName, command: {state: action}})
    });
    refreshAll();
}

async function deleteGroup(name) {
    if (!confirm(`Удалить группу "${name}"?`)) return;
    await fetch('/api/groups', {
        method: 'DELETE',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({name})
    });
    loadGroups();
}

// ============ Сценарии ============
function renderScenarioDeviceCheckboxes() {
    const container = document.getElementById('scenarioDeviceCheckboxes');
    let html = '';
    for (const name of Object.keys(allDeviceStates)) {
        html += `<div class="form-check"><input class="form-check-input scenario-device-check" type="checkbox" value="${escapeHtml(name)}" id="sdev-${name}"><label class="form-check-label" for="sdev-${name}">${escapeHtml(name)}</label></div>`;
    }
    container.innerHTML = html || '<small class="text-muted">Нет устройств</small>';
}

function toggleTriggerFields() {
    const type = document.getElementById('triggerType').value;
    document.getElementById('cronFields').style.display = (type === 'cron') ? 'block' : 'none';
    document.getElementById('intervalField').style.display = (type === 'interval') ? 'block' : 'none';
}

async function addScenario() {
    const name = document.getElementById('scenarioName').value.trim();
    if (!name) return alert('Введите название сценария');
    const triggerType = document.getElementById('triggerType').value;
    const checks = document.querySelectorAll('.scenario-device-check:checked');
    const devices = Array.from(checks).map(cb => cb.value);
    if (devices.length === 0) return alert('Выберите хотя бы одно устройство');
    const actionCommand = JSON.parse(document.getElementById('actionState').value);

    let config = { action: { devices, command: actionCommand } };
    if (triggerType === 'cron') {
        const hour = parseInt(document.getElementById('cronHour').value);
        const minute = parseInt(document.getElementById('cronMinute').value);
        if (isNaN(hour) || isNaN(minute)) return alert('Введите часы и минуты');
        config.cron_params = { hour, minute };
    } else {
        const seconds = parseInt(document.getElementById('intervalSeconds').value);
        if (isNaN(seconds) || seconds < 1) return alert('Введите интервал в секундах');
        config.seconds = seconds;
    }

    await fetch('/api/scenarios', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ name, trigger_type: triggerType, config })
    });
    document.getElementById('scenarioName').value = '';
    loadScenarios();
}

async function loadScenarios() {
    const resp = await fetch('/api/scenarios');
    const scenarios = await resp.json();
    const container = document.getElementById('scenarioList');
    let html = '';
    scenarios.forEach(s => {
        const config = s.config;
        const action = config.action;
        const devices = action ? action.devices.join(', ') : '';
        const cmd = action ? (action.command.state || '') : '';
        let triggerDesc = '';
        if (s.trigger_type === 'cron') {
            const cp = config.cron_params || {};
            triggerDesc = `ежедневно в ${cp.hour}:${String(cp.minute).padStart(2,'0')}`;
        } else {
            triggerDesc = `каждые ${config.seconds} сек.`;
        }
        html += `
        <div class="card mb-2">
            <div class="card-body d-flex justify-content-between align-items-center">
                <div>
                    <h6 class="mb-1">${escapeHtml(s.name)}</h6>
                    <small class="text-muted">${triggerDesc} → ${devices} [${cmd}]</small>
                </div>
                <button class="btn btn-sm btn-outline-danger" onclick="deleteScenario(${s.id})"><i class="bi bi-trash"></i></button>
            </div>
        </div>`;
    });
    container.innerHTML = html || '<p class="text-muted">Нет сценариев</p>';
}

async function deleteScenario(id) {
    if (!confirm('Удалить сценарий?')) return;
    await fetch(`/api/scenarios/${id}`, { method: 'DELETE' });
    loadScenarios();
}

// Инициализация
refreshAll();
loadGroups();
loadScenarios();
setInterval(refreshAll, 5000);

// Сброс активной вкладки на устройства при загрузке
document.getElementById('devices-tab').click();
</script>
</body>
</html>
